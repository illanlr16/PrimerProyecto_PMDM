<div class="container">

    <div class="galletaContainer">

        <span type="button" (click)="hacerClick()" class="imagen_galleta">

            <img class="img" [src]="imagen"]>
            <h1>{{ contador() }}</h1>
        </span>
        
    </div>

    <div class="mejorasContainer">

        <p (click)="mejora()" class="opcion">x2 en click | Coste: {{costeMejoraClick}} galletas</p>
        <p (click)="mejoraPorTiempo1()" class="opcion">Abuelita (1 Galleta/s) | Coste: {{costeMejoraIdle1}} galletas</p>
        <p (click)="mejoraPorTiempo2()" class="opcion">Fábrica (5 Galleta/s) | Coste: {{costeMejoraIdle2}} galletas</p>

    </div>

</div>
